<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Suppressed based on Transactional Rule but keeping simple branding) -->
<header class="flex justify-between items-center w-full px-container-padding py-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" data-icon="menu_book">menu_book</span>
<span class="font-h2 text-primary-container tracking-wide font-semibold">RecordBro</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-container-padding">
<div class="w-full max-auto max-w-[440px] flex flex-col gap-section-gap">
<!-- Branding/Welcome Section -->
<div class="text-center md:text-left">
<h1 class="font-h1 text-h1 text-on-background mb-stack-sm">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-secondary-container">Enter your credentials to access your academic workspace.</p>
</div>
<!-- Sign In Card -->
<div class="bg-surface-container-low border border-outline-variant p-8 md:p-10 rounded-lg">
<form class="flex flex-col gap-stack-lg">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<input class="bg-transparent border-b border-outline-variant py-stack-md px-0 focus:outline-none focus:border-primary transition-colors font-body-md text-on-surface placeholder:text-on-secondary-fixed-variant" id="email" placeholder="name@university.edu" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline transition-all" href="#">Forgot password?</a>
</div>
<input class="bg-transparent border-b border-outline-variant py-stack-md px-0 focus:outline-none focus:border-primary transition-colors font-body-md text-on-surface placeholder:text-on-secondary-fixed-variant" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Actions -->
<div class="pt-stack-md">
<button class="w-full bg-primary-container text-on-primary-container font-label-md py-4 rounded-lg hover:bg-[#b0a0f8] active:scale-[0.98] transition-all duration-150" type="submit">
                            Sign In
                        </button>
</div>
</form>
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-secondary-container">
                        New to RecordBro? 
                        <a class="text-primary-container font-semibold hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Subtle Decorative Element -->
<div class="flex justify-center md:justify-start items-center gap-4 opacity-40">
<div class="h-px w-8 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm tracking-[0.2em] text-on-tertiary-container uppercase">Scholarly Focus</span>
<div class="h-px w-8 bg-outline-variant"></div>
</div>
</div>
</main>
<!-- Footer Meta -->
<footer class="px-container-padding py-8">
<div class="max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-stack-md">
<p class="font-label-sm text-label-sm text-on-tertiary-container">© 2024 RecordBro Academic Systems</p>
<nav class="flex gap-gutter">
<a class="font-label-sm text-label-sm text-on-tertiary-container hover:text-on-surface transition-colors" href="#">Privacy</a>
<a class="font-label-sm text-label-sm text-on-tertiary-container hover:text-on-surface transition-colors" href="#">Terms</a>
<a class="font-label-sm text-label-sm text-on-tertiary-container hover:text-on-surface transition-colors" href="#">Support</a>
</nav>
</div>
</footer>
